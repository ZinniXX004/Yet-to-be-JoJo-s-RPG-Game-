# Supply-chain policy, enforced in CI by cargo-deny.
#
# The point is not paranoia: it is that a portfolio repository should be able to
# answer "what is in your dependency tree and under what licence" without
# hand-waving.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Add ignore entries here only with a dated comment explaining the exposure.
ignore = []

[licences]
# Note: cargo-deny spells this section [licenses]; the alias above is not read.

[licenses]
version = 2
confidence-threshold = 0.9
# MPL-2.0 is required: the godot crate is MPL-licensed. That is file-level
# copyleft and does not affect this project's own MIT source, but it must be an
# explicit decision rather than an accident.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
