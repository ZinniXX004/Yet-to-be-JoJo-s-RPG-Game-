[package]
name = "rpg-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "GDExtension boundary between rpg-core and the Godot 4 project."
publish = false

[lib]
name = "rpg_bridge"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rpg-core = { path = "../core" }
serde_json = { workspace = true }

# Pinned with `=` on purpose. godot-rust is pre-1.0 and ships breaking changes in
# minor releases; an accidental bump would break the build at the worst possible
# time. Bump this deliberately, read the migration guide, and note it in
# CHANGELOG.md.
#
# godot 0.5.5 requires rustc >= 1.94 (its rust-version), unchanged since 0.5.3,
# so the pinned 1.94.1 toolchain still builds it. 0.5.4 added the api-4-7 level,
# but the default level is still 4.6: with 0.5.5 on Godot 4.7.1 the startup line
# reads "Initialize godot-rust (API v4.6.stable.official, runtime
# v4.7.1.stable.official, ...)" (2026-11-02). No cargo command reports that
# number: after every bump, read the startup line in Godot and keep
# compatibility_minimum in src/game/rpg.gdextension equal to it.
godot = "=0.5.5"
