[package]
name = "rpg-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "GDExtension boundary between rpg-core and the Godot 4 project."
publish = false

[lib]
name = "rpg_bridge"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rpg-core = { path = "../core" }
serde_json = { workspace = true }

# Pinned with `=` on purpose. godot-rust is pre-1.0 and ships breaking changes in
# minor releases; an accidental bump would break the build at the worst possible
# time. Bump this deliberately, read the migration guide, and note it in
# CHANGELOG.md.
#
# godot 0.5.4 requires rustc >= 1.94.0, unchanged from 0.5.3, so the pinned
# 1.94.1 toolchain still builds it. 0.5.4 also adds the api-4-7 level, so the API
# version this compiles against may no longer be 4.6. No cargo command reports
# that number: read the godot-rust startup line in Godot and keep
# compatibility_minimum in src/game/rpg.gdextension equal to it.
godot = "=0.5.4"
