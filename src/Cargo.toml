[workspace]
resolver = "2"
members = ["core", "bridge"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
# Lower bound comes from the godot crate (MSRV 1.94.0). CI pins 1.94.1 via
# ../rust-toolchain.toml; this field is what makes the requirement machine
# readable for anyone depending on the crates.
rust-version = "1.94"
repository = "https://github.com/ZinniXX004/Yet-to-be-JoJo-s-RPG-Game-"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1

# Debug builds of the extension are what you actually iterate on in the Godot
# editor, and an unoptimised simulation plus unoptimised serde is noticeably
# sluggish. Optimising dependencies only keeps your own crates fast to compile.
[profile.dev.package."*"]
opt-level = 2
