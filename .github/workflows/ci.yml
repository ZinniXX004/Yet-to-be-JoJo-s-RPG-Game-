# Continuous integration.
#
# Design notes:
#  - Windows is a first-class CI target because that is the primary development
#    machine. A Linux-only pipeline would let Windows-specific breakage (path
#    separators, line endings, DLL naming) reach main unnoticed. macOS is in the
#    core and bridge matrices for the same reason: release.yml ships a macOS
#    archive, and until this matrix included it, a release tag was the first
#    time anything was built for that platform.
#  - The godot job is the only automated check on the Godot layer. It plays
#    every declared encounter headless through the real bridge; see
#    tools/godot_smoke.py for what that does and does not prove.
#  - clippy runs with -D warnings. A lint that is merely reported is a lint that
#    accumulates.
#  - Every job is cheap and independent, so a failure points at one cause.
#  - The final `ci` job is the single status check to require in branch
#    protection; adding a job later then does not require reconfiguring GitHub.
#  - The toolchain is not installed by an action. ../rust-toolchain.toml pins
#    1.94.1 and rustup honours it for every cargo invocation, so CI and the
#    development machine cannot diverge. Each job prints what it resolved.

name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

# Superseded runs on the same ref are pointless; cancel them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # RUSTFLAGS is deliberately NOT set to "-D warnings" here.
  #
  # A workflow-level RUSTFLAGS applies to every crate cargo compiles, including
  # the whole dependency tree. One warning emitted by gdext, glam, venial or syn
  # under a pinned rustc then turns CI red on a commit that touched none of them,
  # and the error message points at somebody else's source file. Denying warnings
  # is a policy for code we own, so it is passed to clippy per job instead.

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7
      - name: Resolved toolchain
        run: rustup show active-toolchain && cargo fmt --version
      - run: cargo fmt --all --check

  content:
    name: content validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Stdlib only on purpose: a content validator that needs a dependency tree
      # is a validator people stop running. The script defaults to ./data, so it
      # must run from the repository root.
      - name: Validate data/*.json
        run: python src/data-pipeline/validate_data.py
      # tools/probe/ is not shipped, but its combatants are hand-copied from
      # data/, and copies do not follow their originals. Issue #14 found this
      # roster two milestones stale -- no resistance tables at all, and an Iron
      # Brawler still at atk 105 after Change G shipped 135 -- which made the
      # row labelled "control" stop being the shipped creature.
      #
      # Validating the directory on its own would not have caught either fault:
      # an absent resist table is legal and 105 is a valid integer, so both
      # files were internally consistent and had merely stopped describing the
      # game. --mirror is the comparison, and it is here rather than in a README
      # because the README already asked for this and was not obeyed. See #30.
      #
      # skills and stands are not overridden: the probe roster borrows the
      # shipped ones, which is why references like stand.iron_hymn resolve.
      # Warnings are expected from this run (0..100 bands by design) and do not
      # fail it; only a drifted field or a broken reference does.
      - name: Validate tools/probe against data/
        run: >-
          python src/data-pipeline/validate_data.py
          --combatants tools/probe/combatants.probe.json
          --matchups tools/probe/matchups.probe.json
          --mirror data

  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7
      - name: Resolved toolchain
        run: rustup show active-toolchain && cargo --version && cargo clippy --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: core-${{ matrix.os }}
      - name: Clippy
        run: cargo clippy -p rpg-core --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test -p rpg-core --all-targets --all-features
      - name: Doc build
        run: cargo doc -p rpg-core --no-deps

  balance:
    name: balance harness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7
      - name: Resolved toolchain
        run: rustup show active-toolchain && cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: balance-ubuntu-latest
      # The `core` job already runs tests/balance_bounds.rs, which asserts the
      # same thing and is the actual gate. This job exists for its output: the
      # binary prints win rate, median turns, damage dealt and taken, SP spent,
      # miss rate and survival for every combatant in every encounter, so a
      # reviewer can read the consequences of a content change straight from the
      # pull request instead of checking the branch out and running it.
      #
      # No arguments, deliberately. The content is compiled in with include_str!,
      # and --combatants / --matchups exist only for throwaway probe runs under
      # tools/probe/. Passing either here would let the gate measure something
      # other than the shipped game. Exit code 1 on a band violation is what
      # makes this blocking.
      - name: Every encounter inside its declared band
        run: cargo run -q -p rpg-core --bin balance

  # The 300-seed win-rate diff of a pull request, posted as one comment.
  #
  # Informational, never a gate: it is deliberately NOT in the `needs` list of
  # `ci`, so neither a failure nor a skip here can block a merge. The gate is
  # the `balance` job above. This job only answers "what did this pull request
  # do to every win rate", which the PR template used to ask authors to paste
  # by hand.
  #
  # What is compared: actions/checkout on a pull_request event checks out the
  # merge of the pull request into its base, and that merge is measured
  # against the base commit itself (github.event.pull_request.base.sha), built
  # in a git worktree so it reads its own compiled-in data/. The difference is
  # then this pull request's effect and nothing else, even when the branch is
  # behind its base.
  #
  # Security: the PR's own code is built and run here, so the token that can
  # write comments is handed to the posting step only, and checkout does not
  # persist it into .git/config. Every value a pull request controls reaches
  # a script through env, never by expansion inside it (as in pr-guard.yml).
  #
  # Permissions, from docs.github.com/en/rest/issues/comments: listing issue
  # comments needs "Issues" or "Pull requests" read, creating and updating
  # one needs "Issues" or "Pull requests" write. pull-requests: write is the
  # narrower of the two, since issues: write would also reach every issue.
  # Fork and Dependabot pull requests get a read-only token; then the table
  # stays in the job summary and the job still succeeds.
  balance-diff:
    name: balance diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the base commit is present for the worktree
          # without a second, authenticated fetch.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Resolved toolchain
        working-directory: src
        run: rustup show active-toolchain && cargo --version
      # Its own cache: rust-cache keys on the job id, so sharing the balance
      # job's cache would mean changing that job's key too.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: balance-diff-ubuntu-latest
      - name: Balance report of the head (the merge into the base)
        working-directory: src
        run: |
          mkdir -p "$RUNNER_TEMP/balance"
          cargo run -q -p rpg-core --bin balance -- --json --no-fail > "$RUNNER_TEMP/balance/head.json"
      # Same target directory as the head build, so only rpg-core itself is
      # rebuilt when Cargo.lock is unchanged.
      - name: Balance report of the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/src/target
        run: |
          merge_base=$(git rev-parse HEAD^1)
          if [ "$merge_base" != "$BASE_SHA" ]; then
            echo "::warning::The merge commit's base parent is $merge_base, the event's base is $BASE_SHA; the diff may include base commits."
          fi
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          cd "$RUNNER_TEMP/base/src"
          cargo run -q -p rpg-core --bin balance -- --json --no-fail > "$RUNNER_TEMP/balance/base.json"
      - name: Diff table into the job summary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "<!-- balance-diff -->"
            echo "### Balance diff, 300 seeds per encounter"
            echo
            python tools/balance_diff.py \
              --base-ref "${BASE_SHA:0:7}" --head-ref "${HEAD_SHA:0:7} merged into ${BASE_SHA:0:7}" \
              "$RUNNER_TEMP/balance/base.json" "$RUNNER_TEMP/balance/head.json"
            echo
            echo "Posted by the \`balance diff\` job of \`.github/workflows/ci.yml\` and updated on every push. The author still explains the change in the pull request."
          } > "$RUNNER_TEMP/balance/comment.md"
          cat "$RUNNER_TEMP/balance/comment.md" >> "$GITHUB_STEP_SUMMARY"
      # REST only. One comment per pull request: the previous one is found by
      # the hidden marker on its first line and by its author, the Actions
      # bot, then PATCHed; otherwise a new one is POSTed.
      - name: Create or update the pull request comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$HEAD_REPO" != "$REPO" ] || [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "::notice::Read-only token for $HEAD_REPO by $ACTOR; the table is in the job summary only."
            exit 0
          fi
          jq -n --rawfile body "$RUNNER_TEMP/balance/comment.md" '{body: $body}' > "$RUNNER_TEMP/balance/payload.json"
          comment_id=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- balance-diff -->"))) | .id' \
            | head -n 1)
          if [ -n "$comment_id" ]; then
            method=PATCH
            endpoint="repos/$REPO/issues/comments/$comment_id"
          else
            method=POST
            endpoint="repos/$REPO/issues/$PR_NUMBER/comments"
          fi
          if gh api --method "$method" "$endpoint" --input "$RUNNER_TEMP/balance/payload.json" \
              --jq '.html_url' 2> "$RUNNER_TEMP/balance/gh.err"; then
            exit 0
          fi
          cat "$RUNNER_TEMP/balance/gh.err" >&2
          if grep -q "HTTP 403" "$RUNNER_TEMP/balance/gh.err"; then
            echo "::warning::The token cannot write comments here (HTTP 403); the table is in the job summary only."
            exit 0
          fi
          exit 1

  bridge:
    name: bridge (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7
      # godot-rust uses prebuilt GDExtension bindings by default, so no Godot
      # binary is needed here. libclang is installed anyway because bindgen is
      # pulled in on some feature paths and the failure mode is cryptic.
      - name: Install libclang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Resolved toolchain
        run: rustup show active-toolchain && cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: bridge-${{ matrix.os }}
      # Only our crate is linted. The generated gdext bindings are not ours to
      # fix, and -D warnings across them is how you get an unfixable red build.
      - name: Clippy
        run: cargo clippy -p rpg-bridge --all-targets -- -D warnings
      - name: Build cdylib
        run: cargo build -p rpg-bridge

  godot:
    name: godot smoke (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The engine the project is developed and played on, confirmed locally as
      # 4.7.1.stable.official.a13da4feb. tools/godot_smoke.py reads this line to
      # warn when a local Godot differs, so it is the single place to bump.
      GODOT_VERSION: "4.7.1-stable"
      # From the release's SHA512-SUMS.txt for Godot_v4.7.1-stable_linux.x86_64.zip.
      # A download that does not match is not run.
      GODOT_SHA512: "4ccdab7a48eeccbe8819a2fc1f6262f8d72065d98601bcb3743fcbd7ebd39f373758a788ee3293a05ec5b2c48538266c437404312e372225cd2df273945a2de9"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Resolved toolchain
        working-directory: src
        run: rustup show active-toolchain && cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: godot-ubuntu-latest
      - name: Download Godot (pinned, checksum-verified)
        run: |
          zip="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$zip" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${zip}"
          echo "${GODOT_SHA512}  $RUNNER_TEMP/$zip" | sha512sum -c -
          unzip -q "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      # Builds the bridge, syncs data/ into res://data, imports the project and
      # autoplays one battle per encounter. Fails on a non-zero exit, a battle
      # that never reaches an outcome, or any ERROR or WARNING on the console.
      - name: Every encounter plays to an outcome in Godot
        run: python tools/godot_smoke.py

  audit:
    name: supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # This action runs cargo-deny inside its own container, which ships an
      # older default toolchain and therefore has to install the pinned 1.94.1
      # from rust-toolchain.toml on every run. That costs about thirty seconds
      # and is the price of the pin being honoured everywhere.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src/Cargo.toml
          command: check advisories bans licenses sources

  spelling:
    name: spelling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Pinned to an exact release, not to @v1: the floating major tag was
      # documented here as a pin and is not one. v1.49.0 shipped nothing but a
      # July 2026 dictionary update and turned PR #36 red for "mis-sized" on
      # a branch whose prose predated it. An exact tag makes a dictionary
      # change arrive as a reviewable Dependabot pull request instead of as a
      # red build on unrelated work.
      - uses: crate-ci/typos@v1.51.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The prose rule: no em dash, en dash or double hyphen used as
      # punctuation in tracked Markdown. Stdlib only, like the validator; it
      # lists files with git ls-files, so it runs from the repository root.
      - name: Prose punctuation
        run: python tools/check_prose.py
      # The fixtures of the script the `balance diff` job runs. That job never
      # blocks a merge, so its script is tested here, where a failure does.
      - name: Balance diff self-test
        run: python tools/balance_diff.py --self-test

  links:
    name: markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          # Dead links in a README are the most visible kind of rot on a
          # portfolio repository, so this job stays blocking.
          #
          # 403 and 429 are accepted because they mean "the host dislikes CI
          # traffic", not "the page is gone". Hosts that answer that way
          # unconditionally are listed in .lycheeignore with a reason each.
          #
          # No --exclude-mail: lychee 0.24 removed it in favour of
          # --include-mail, which is already false by default. Passing the old
          # flag aborts the run with "unexpected argument" before any link is
          # checked, which reads like a link failure but is an argument error.
          args: >-
            --no-progress
            --max-retries 2
            --accept 200,206,301,302,303,304,307,308,403,429
            './**/*.md'
          fail: true

  ci:
    name: ci
    if: always()
    needs: [format, content, core, balance, bridge, godot, audit, spelling, links]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A skipped job counts as a failure. Requiring only this check in branch
      # protection is safe precisely because it refuses to be green by default.
      - name: Verify all jobs succeeded
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')
        run: |
          echo "One or more required jobs did not succeed."
          exit 1
      - run: echo "All checks passed."
